name: Build and release workers

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 3.0.0
        required: true
        default: 3.0.0
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve release version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="${REF_NAME#v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid semantic version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Set package version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Run tests and checks
        run: |
          npm test
          npm run check

      - name: Build both workers
        run: npm run bundle

      - name: Verify build artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          test -s _worker-transmission.js
          test -s _worker-admin.js
          grep -Fq "// edgetunnel-transmission $VERSION" _worker-transmission.js
          grep -Fq "// edgetunnel-admin $VERSION" _worker-admin.js

      - name: Upload transmission artifact
        uses: actions/upload-artifact@v4
        with:
          name: edgetunnel-transmission-${{ steps.version.outputs.version }}
          path: _worker-transmission.js
          if-no-files-found: error

      - name: Upload admin artifact
        uses: actions/upload-artifact@v4
        with:
          name: edgetunnel-admin-${{ steps.version.outputs.version }}
          path: _worker-admin.js
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            _worker-transmission.js
            _worker-admin.js
