name = "edgetunnel-transmission"
main = "_worker-transmission.js"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]
account_id = "0e978a4a2e65977ade0b08f20019a498"

# Durable Object:传输层自己 export QuotaDO 类
[[durable_objects.bindings]]
name = "QUOTA_DO"
class_name = "QuotaDO"

# DO 迁移:注册 QuotaDO 类
[[migrations]]
tag = "v1"
new_sqlite_classes = ["QuotaDO"]

# KV(与管理层共用)
[[kv_namespaces]]
binding = "KV"
id = "d88602b1f59548b08e7b9ab36dc1c7a3"

# Service Binding → 管理层
[[services]]
binding = "USER_ADMIN"
service = "edgetunnel-admin"

# Routes:数据面路径分发到传输层(520 域名下 /ws /grpc /xhttp 走这里)
routes = [
  { pattern = "520-10086.cc.cd/ws/*", zone_id = "c63469341e31b614badccea6338e2721" },
  { pattern = "520-10086.cc.cd/grpc/*", zone_id = "c63469341e31b614badccea6338e2721" },
  { pattern = "520-10086.cc.cd/xhttp/*", zone_id = "c63469341e31b614badccea6338e2721" },
]
